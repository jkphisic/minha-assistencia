<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minha Loja</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    body { background-color: #faf8f5; color: #333; padding: 20px 5%; }
    header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 40px; }
    .btn-vermelho { background-color: #9e1b22; color: #fff; padding: 12px 24px; text-decoration: none; border-radius: 4px; font-weight: bold; }
    .hero { display: flex; gap: 40px; align-items: center; margin-bottom: 40px; }
    .hero-esq, .hero-dir { flex: 1; }
    h1 { font-family: Georgia, serif; color: #7a151b; font-size: 2.5rem; margin-top: 10px; }
    .hero-dir p { margin-bottom: 20px; line-height: 1.5; color: #555; }
    .banner { background: linear-gradient(135deg, #6b0f14, #a81c24); color: #fff; padding: 50px; border-radius: 12px; }
  </style>
</head>
<body>
  <header>
    <h2>Sua Marca</h2>
    <div>
      <a href="#" style="margin-right: 20px; color: #333; text-decoration: none;">Nossas lojas</a>
      <a href="#" class="btn-vermelho">Fale com a gente ></a>
    </div>
  </header>

  <section class="hero">
    <div class="hero-esq">
      <small>SUA CASA SEMPRE BELA</small>
      <h1>Sua casa, do seu jeito. Escolha com a gente.</h1>
    </div>
    <div class="hero-dir">
      <p>Encontre móveis e eletros para o seu dia a dia. Nossa equipe ajuda você a escolher o que combina com sua casa.</p>
      <a href="#" class="btn-vermelho">Encontrar minha loja ></a>
    </div>
  </section>

  <section class="banner">
    <p>SUA MARCA</p>
    <h2 style="font-size: 3rem; margin-top: 10px;">ESQUENTA BLACK</h2>
  </section>
</body>
</html>
